<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JML Coach Immo — Compte</title>
<style>:root{--bg:#f6f2e9;--card:#fffdf8;--ink:#26342d;--muted:#6c746f;--gold:#b08a45;--dark:#17352d;--line:#e6ddce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}.brand{font-size:24px;font-weight:850;color:var(--dark)}.brand span{color:var(--gold)}input,button{width:100%;min-height:46px;padding:10px 13px;border-radius:12px;font:inherit;margin-top:8px}input{border:1px solid var(--line)}button{border:0;background:var(--gold);color:#fff;font-weight:800}.secondary{background:white;color:var(--dark);border:1px solid var(--line)}.hidden{display:none}.stat{display:inline-block;padding:12px;margin:6px 6px 0 0;border:1px solid var(--line);border-radius:12px}.muted{color:var(--muted);font-size:14px}a{color:var(--dark);font-weight:700}</style></head><body><main class="wrap"><div class="brand">JML <span>Coach Immo</span></div>
<section id="auth" class="card"><h2>Créer ton compte</h2><p class="muted">Le compte permettra ensuite de conserver tes simulations et ton niveau.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe (8 caractères minimum)"><button id="register">Créer mon compte</button><button id="login" class="secondary">Se connecter</button><p id="msg" class="muted"></p></section>
<section id="dash" class="card hidden"><h2>Mon espace</h2><div id="stats"></div><h3>Historique</h3><div id="history"></div><button id="logout" class="secondary">Se déconnecter</button><p style="margin-top:16px"><a href="simulator.html">← Retour au simulateur</a> · <a href="pricing.html">Voir les offres</a></p></section></main>
<script>
let token=localStorage.getItem("jml_token");
const $=x=>document.getElementById(x);
function msg(x){$("msg").textContent=x}
async function call(url,opts={}){opts.headers={...(opts.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Erreur");return d}
async function auth(mode){try{const d=await call("/api/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});token=d.token;localStorage.setItem("jml_token",token);await load()}catch(e){msg(e.message)}}
async function load(){try{const d=await call("/api/me");$("auth").classList.add("hidden");$("dash").classList.remove("hidden");$("stats").innerHTML="<span class='stat'><b>Plan</b><br>"+d.user.plan+"</span><span class='stat'><b>Simulations</b><br>"+d.user.sessions+"</span><span class='stat'><b>Temps ce mois</b><br>"+d.user.monthly_seconds+" s</span>";$("history").innerHTML=d.history.length?d.history.map(x=>"<p><b>"+x.scenario+"</b> — "+(x.score??"—")+"/100 <span class='muted'>"+new Date(x.created_at).toLocaleString("fr-FR")+"</span></p>").join(""):"<p class='muted'>Aucune simulation enregistrée.</p>"}catch(e){localStorage.removeItem("jml_token");token=null}}
$("register").onclick=()=>auth("register");$("login").onclick=()=>auth("login");$("logout").onclick=()=>{localStorage.removeItem("jml_token");location.reload()};if(token)load();
</script></body></html>
