<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JML Objections</title>
<style>
:root{--bg:#f6f2e9;--card:#fffdf8;--ink:#26342d;--muted:#6c746f;--gold:#b08a45;--dark:#17352d;--line:#e6ddce}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:800;font-size:24px;color:var(--dark)}.brand span{color:var(--gold)}.badge{font-size:12px;border:1px solid var(--line);padding:7px 10px;border-radius:999px;background:#fff}.hero{background:var(--dark);color:white;border-radius:22px;padding:28px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#dfe7e2}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.cats button,.objection{width:100%;text-align:left;border:1px solid var(--line);background:white;padding:12px;border-radius:12px;margin:6px 0;cursor:pointer}.cats button.active,.objection.active{border-color:var(--gold);background:#fbf6e9}.objection small{display:block;color:var(--muted);margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button,.primary,.secondary{border:0;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}.tabs button{background:#eee8dc}.tabs button.active,.primary{background:var(--gold);color:white}.secondary{background:#e9eee9;color:var(--dark)}.quote{font-size:22px;font-weight:750;line-height:1.35;padding:18px;background:#f8f3e8;border-radius:14px}.answer{line-height:1.65;white-space:pre-line}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{border:1px solid var(--line);border-radius:14px;padding:14px}.mini h3{margin:0 0 7px;font-size:14px}.muted{color:var(--muted)}.score{font-size:34px;font-weight:850;color:var(--dark)}.meter{height:9px;background:#e6e2d8;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit}.footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:780px){.grid,.two{grid-template-columns:1fr}.hero h1{font-size:26px}}
</style></head>
<body><main class="wrap">
<div class="top"><div class="brand">JML <span>Objections</span></div><div class="badge">V1 autonome</div></div>
<section class="hero"><h1>Maîtriser les objections vendeur.</h1><p>Apprendre → s'entraîner → répondre naturellement.</p><div style="margin-top:16px"><a href="simulator.html" style="display:inline-block;background:#b08a45;color:#fff;text-decoration:none;font-weight:800;padding:12px 15px;border-radius:12px">🎙️ Tester le Simulateur IA</a></div></section>
<div class="grid">
<aside class="panel"><b>Catégories</b><div class="cats" id="cats"></div><hr><b>Objections</b><div id="list"></div></aside>
<section class="card"><div class="quote" id="objection"></div><div class="tabs"><button data-tab="short" class="active">Réponse courte</button><button data-tab="long">Argumentée</button><button data-tab="question">Question</button><button data-tab="avoid">À éviter</button><button data-tab="train">🎙️ Entraînement</button></div><div id="content"></div></section>
</div><div class="footer"><a href="simulator.html" style="color:#17352d;font-weight:800">🎙️ Simulateur IA</a> · <a href="account.html" style="color:#17352d;font-weight:800">👤 Mon compte</a><br>JML Objections — application indépendante, sans connexion à JML Prospection ni à JML Estimateur.</div>
</main>
<script>
const data=[
{id:1,cat:'Honoraires',o:'Votre commission est trop élevée.',short:'Je comprends. Avant de parler du montant, qu’est-ce qui vous paraît trop élevé : le pourcentage ou le coût au regard du service attendu ?',long:'Je comprends que les honoraires soient un point important. Mon objectif n’est pas de vous faire payer pour publier une annonce, mais de vous apporter une stratégie de commercialisation, une sélection des acquéreurs, la négociation et le suivi jusqu’à la vente. La vraie question est donc de savoir ce que vous attendez du professionnel en échange de ses honoraires.',q:'Quand vous comparez les honoraires, qu’est-ce qui compte le plus pour vous : le montant ou le résultat et le service associé ?',avoid:'Ne pas se justifier pendant plusieurs minutes ni dénigrer les autres agences.'},
{id:2,cat:'Vente seul',o:'Je veux vendre seul.',short:'Bien sûr. Qu’est-ce qui vous donne envie de commencer seul aujourd’hui ?',long:'C’est parfaitement compréhensible. Beaucoup de propriétaires souhaitent d’abord tester la vente par eux-mêmes. Mon rôle n’est pas de vous empêcher de le faire, mais de comprendre votre projet et de voir à quel moment mon intervention pourrait vous faire gagner du temps ou sécuriser la vente.',q:'Si vous essayez seul, quel serait pour vous le signe qu’il est temps de vous faire accompagner ?',avoid:'Ne pas répondre immédiatement par « vous allez perdre de l’argent ».'},
{id:3,cat:'Réflexion',o:'Je veux réfléchir.',short:'Bien sûr. Pour que je vous laisse réfléchir utilement, qu’est-ce qui vous fait encore hésiter ?',long:'Je préfère aussi que vous preniez une décision avec toutes les informations. Si vous me dites ce qui vous fait hésiter, je peux simplement répondre à ce point précis plutôt que vous donner encore plus d’arguments.',q:'Qu’est-ce que vous souhaitez surtout vérifier avant de prendre votre décision ?',avoid:'Ne pas forcer la signature ni demander simplement « à quoi devez-vous réfléchir ? » sur un ton pressant.'},
{id:4,cat:'Concurrence',o:'Une autre agence prend moins.',short:'C’est une information importante. Est-ce que vous comparez uniquement les honoraires ou l’ensemble de ce qui est proposé ?',long:'Les honoraires peuvent effectivement être différents d’une agence à l’autre. Pour comparer correctement, je vous propose de regarder le service, la méthode de commercialisation, le suivi et la stratégie de négociation en même temps que le montant des honoraires.',q:'Qu’est-ce que cette autre agence vous propose concrètement en échange de ses honoraires ?',avoid:'Ne pas critiquer l’agence concurrente ni affirmer qu’elle travaille moins bien sans preuve.'},
{id:5,cat:'Annonce',o:'Je veux essayer LeBonCoin d’abord.',short:'Pourquoi souhaitez-vous commencer par LeBonCoin avant de vous faire accompagner ?',long:'C’est une possibilité. La question est surtout de savoir comment vous allez mesurer si cette stratégie fonctionne : nombre de contacts, visites qualifiées, offres reçues et délai. Si les résultats ne sont pas au rendez-vous, nous pourrons réévaluer la stratégie.',q:'Au bout de combien de temps ou avec quels résultats considérerez-vous que l’essai est concluant ?',avoid:'Ne pas dénigrer LeBonCoin ou prétendre qu’une annonce seule ne peut jamais fonctionner.'},
{id:6,cat:'Prix',o:'Je veux 20 000 € de plus.',short:'D’accord. Qu’est-ce qui vous amène précisément à ce prix ?',long:'Votre objectif de prix est important et je veux le comprendre. Avant de vous dire si le marché peut l’absorber, regardons les éléments objectifs : ventes comparables, caractéristiques du bien, concurrence actuelle et délai souhaité.',q:'Sur quoi vous basez-vous principalement pour arriver à ces 20 000 € supplémentaires ?',avoid:'Ne pas contredire brutalement le propriétaire avec un chiffre sorti de nulle part.'},
{id:7,cat:'Mandat',o:'Je ne veux pas signer de mandat exclusif.',short:'Je comprends. Qu’est-ce qui vous gêne le plus dans l’exclusivité ?',long:'Je comprends votre réserve. Plutôt que de défendre l’exclusivité en général, j’aimerais comprendre ce que vous souhaitez conserver comme liberté. Ensuite, nous pouvons voir si le fonctionnement du mandat répond réellement à cette inquiétude.',q:'Qu’est-ce que vous craignez de perdre en signant en exclusivité ?',avoid:'Ne pas présenter l’exclusivité comme une obligation ou culpabiliser le vendeur.'}
];
let selected=data[0],tab='short',currentCat='Toutes';
const cats=[...new Set(data.map(x=>x.cat))],catsEl=document.getElementById('cats'),list=document.getElementById('list'),objection=document.getElementById('objection'),content=document.getElementById('content');
function renderCats(){catsEl.innerHTML='<button class="active" onclick="filterCat(\'Toutes\')">Toutes</button>'+cats.map(c=>`<button onclick="filterCat('${c}')">${c}</button>`).join('')}
function renderList(cat='Toutes'){list.innerHTML=data.filter(x=>cat==='Toutes'||x.cat===cat).map(x=>`<button class="objection ${x.id===selected.id?'active':''}" onclick="select(${x.id})">${x.o}<small>${x.cat}</small></button>`).join('')}
function select(id){selected=data.find(x=>x.id===id);tab='short';render()}
function filterCat(c){currentCat=c;renderList(c);document.querySelectorAll('.cats button').forEach(b=>b.classList.toggle('active',b.textContent===c))}
function render(){objection.textContent='« '+selected.o+' »';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderContent();renderList(currentCat)}
function renderContent(){if(tab!=='train'){content.innerHTML=`<div class="answer">${selected[tab==='question'?'q':tab]}</div>`;return}content.innerHTML=`<div class="mini"><h3>🎙️ Réponds comme en rendez-vous</h3><p class="muted">Objection : ${selected.o}</p><button class="primary" id="speak">🎙️ Commencer</button><button class="secondary" id="stop">Arrêter</button><textarea id="transcript" placeholder="Ta réponse apparaîtra ici…"></textarea><div id="analysis"></div></div>`;setupSpeech()}
function analyse(t){const s=t.trim(),words=s.split(/\s+/).filter(Boolean).length;let pts=0;if(words>=20)pts+=20;if(words<=100)pts+=15;if(/comprend|je comprends|je vois|c'est compréhensible/i.test(s))pts+=20;if(/pourquoi|qu'est-ce|comment|quel|quelle/i.test(s))pts+=20;if(/objectif|besoin|projet|attente/i.test(s))pts+=15;if(!/garanti|toujours|jamais|obligé/i.test(s))pts+=10;pts=Math.min(100,pts);const advice=[];if(!/comprend|je vois|compréhensible/i.test(s))advice.push('Commence par reconnaître la préoccupation du vendeur.');if(!/pourquoi|qu'est-ce|comment|quel|quelle/i.test(s))advice.push('Pose une question ouverte avant de développer ton argument.');if(words>100)advice.push('Raccourcis ta réponse : vise une première réponse de 20 à 40 secondes.');if(!advice.length)advice.push('Bonne structure : écoute, reformulation, question puis argument.');document.getElementById('analysis').innerHTML=`<div class="mini" style="margin-top:12px"><div class="score">${pts}/100</div><div class="meter"><i style="width:${pts}%"></i></div><p><b>Analyse :</b> ${advice.join(' ')}</p><p class="muted">Longueur : ${words} mots. L'analyse V2 pourra être remplacée par une IA conversationnelle.</p></div>`}
function setupSpeech(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;const r=new R();r.lang='fr-FR';r.interimResults=true;r.continuous=true;const sp=document.getElementById('speak'),st=document.getElementById('stop'),tr=document.getElementById('transcript');sp.onclick=()=>{tr.value='';r.start()};st.onclick=()=>r.stop();r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;tr.value=t;if(e.results[e.resultIndex].isFinal)analyse(t)};r.onerror=()=>{document.getElementById('analysis').innerHTML='<p class="muted">Le micro n’a pas pu être utilisé. Tu peux saisir ta réponse manuellement.</p>'};tr.addEventListener('blur',()=>{if(tr.value)analyse(tr.value)})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});renderCats();renderList();render();
</script></body></html>
