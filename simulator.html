<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JML Objections — Simulateur IA</title>
<style>
:root{--bg:#f6f2e9;--card:#fffdf8;--ink:#26342d;--muted:#6c746f;--gold:#b08a45;--dark:#17352d;--line:#e6ddce}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:24px;color:var(--dark)}.brand span{color:var(--gold)}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.hero{margin-top:18px;background:var(--dark);color:white;padding:25px;border-radius:22px}.hero h1{margin:0 0 7px}.hero p{margin:0;color:#dfe7e2}.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}select,button{min-height:46px;border-radius:12px;padding:10px 13px;font:inherit}select{border:1px solid var(--line);background:white}.primary{border:0;background:var(--gold);color:white;font-weight:800}.secondary{border:1px solid var(--line);background:white;color:var(--dark);font-weight:700}.danger{border:0;background:#7c4b3c;color:#fff}.status{margin-top:12px;padding:12px;border-radius:12px;background:#f0ece2}.chat{margin-top:16px;min-height:240px;max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:14px;background:white}.bubble{max-width:82%;padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.5;white-space:pre-wrap}.ai{background:#edf0ec}.me{background:#f8f0dc;margin-left:auto}.hint{color:var(--muted);font-size:13px}.analysis{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:14px;padding:13px}.metric b{display:block;font-size:12px;color:var(--muted)}.metric strong{font-size:25px;color:var(--dark)}ul{margin:8px 0;padding-left:20px}@media(max-width:650px){.analysis{grid-template-columns:1fr}.bubble{max-width:94%}}
</style></head><body><main class="wrap">
<div class="top"><div class="brand">JML <span>Objections</span></div><div class="badge">Simulateur IA V2</div></div>
<section class="hero"><h1>🎙️ Rendez-vous vendeur avec l'IA</h1><p>L'IA joue le propriétaire. Tu réponds comme en rendez-vous réel.</p></section>
<section class="card">
<div class="row"><select id="scenario"><option value="commission">Commission trop élevée</option><option value="seul">Vendre seul</option><option value="prix">Prix trop élevé</option><option value="exclusif">Mandat exclusif</option><option value="concurrence">Agence concurrente</option><option value="reflexion">Je veux réfléchir</option></select><button class="primary" id="start">Démarrer la simulation</button><button class="danger" id="stop" disabled>Terminer</button></div>
<div class="status" id="status">Choisis un scénario puis démarre. Le mode vocal nécessite le backend IA.</div>
<div class="chat" id="chat"><div class="hint">La conversation apparaîtra ici.</div></div>
<div class="row" style="margin-top:12px"><button class="secondary" id="textMode">Mode texte</button><input id="reply" placeholder="Réponse texte pour tester le scénario…" style="flex:3;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit"><button class="primary" id="send">Envoyer</button></div>
<div id="analysis"></div>
</section></main>
<script>
let ws=null,audioContext=null,micStream=null,processor=null,playbackTime=0,transcript=[],running=false,startedAt=0;
const $=id=>document.getElementById(id);
function addBubble(who,text){const d=document.createElement("div");d.className="bubble "+(who==="me"?"me":"ai");d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}
function addTranscript(who,text){if(!text)return;transcript.push({who,text});addBubble(who,text)}
function base64ToBytes(b64){const bin=atob(b64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function bytesToBase64(bytes){let s="";const step=0x8000;for(let i=0;i<bytes.length;i+=step)s+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(s)}
function floatTo16(input){const out=new Int16Array(input.length);for(let i=0;i<input.length;i++){const v=Math.max(-1,Math.min(1,input[i]));out[i]=v<0?v*32768:v*32767}return new Uint8Array(out.buffer)}
function downsample(input,inRate,outRate){if(inRate===outRate)return input;if(inRate<outRate)return input;const ratio=inRate/outRate,outLen=Math.round(input.length/ratio),out=new Float32Array(outLen);let offset=0;for(let i=0;i<outLen;i++){const next=Math.round((i+1)*ratio);let sum=0,count=0;for(let j=Math.round(i*ratio);j<next&&j<input.length;j++){sum+=input[j];count++}out[i]=count?sum/count:0}return out}
function playPcm24(b64){
  if(!audioContext)return;
  const bytes=base64ToBytes(b64), samples=new Int16Array(bytes.buffer,bytes.byteOffset,Math.floor(bytes.byteLength/2));
  const buffer=audioContext.createBuffer(1,samples.length,24000),data=buffer.getChannelData(0);
  for(let i=0;i<samples.length;i++)data[i]=samples[i]/32768;
  const src=audioContext.createBufferSource();src.buffer=buffer;src.connect(audioContext.destination);
  const now=audioContext.currentTime;playbackTime=Math.max(playbackTime,now);
  src.start(playbackTime);playbackTime+=buffer.duration;
}
function sendText(text){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({clientContent:{turns:[{role:"user",parts:[{text}]}],turnComplete:true}}))}
async function start(){
  const authToken=localStorage.getItem("jml_token");
  if(!authToken){$("status").textContent="🔐 Crée ou ouvre ton compte pour utiliser le simulateur IA.";return}
  $("start").disabled=true;$("stop").disabled=false;$("status").textContent="Connexion à Gemini Live…";$("chat").innerHTML="";$("analysis").innerHTML="";transcript=[];startedAt=Date.now();
  try{
    const r=await fetch("/api/gemini-token",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+authToken},body:JSON.stringify({scenario:$("scenario").value})});
    const data=await r.json();if(!r.ok)throw new Error(data?.error?.error?.message||data?.error||"Impossible d'obtenir le jeton Gemini.");
    ws=new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token="+encodeURIComponent(data.token));
    audioContext=new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();playbackTime=audioContext.currentTime;
    ws.onopen=()=>{
      ws.send(JSON.stringify({setup:{
        model:"models/gemini-3.8-live",
        generationConfig:{
          responseModalities:["AUDIO"],
          speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Kore"}}}
        },
        inputAudioTranscription:{languageCodes:["fr-FR"]},
        outputAudioTranscription:{languageCodes:["fr-FR"]},
        systemInstruction:{parts:[{text:sellerInstructionsClient($("scenario").value)}]},
        sessionResumption:{}
      }}));
    };
    ws.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch{return}
      if(m.setupComplete){
        $("status").textContent="🟢 Simulation active — parle naturellement au vendeur.";
        sendText("Commence la simulation maintenant par une courte phrase de vendeur correspondant à l'objection choisie.");
        startMic();
      }
      const c=m.serverContent;
      if(!c)return;
      if(c.inputTranscription?.text)addTranscript("me",c.inputTranscription.text);
      if(c.outputTranscription?.text)addTranscript("ai",c.outputTranscription.text);
      if(c.modelTurn?.parts)for(const part of c.modelTurn.parts)if(part.inlineData?.data)playPcm24(part.inlineData.data);
      if(c.interrupted){playbackTime=audioContext?.currentTime||0}
    };
    ws.onerror=()=>{$("status").textContent="⚠️ Erreur de connexion Gemini Live."};
    ws.onclose=e=>{if(running)$("status").textContent="⚠️ Gemini a fermé la connexion : "+(e.reason||"connexion terminée")};
    running=true;
  }catch(e){
    cleanup();$("status").textContent="⚠️ "+e.message;$("start").disabled=false;$("stop").disabled=true;
  }
}
function sellerInstructionsClient(scenario){
  const goals={commission:"Le propriétaire pense que les honoraires sont trop élevés et compare avec une agence moins chère.",seul:"Le propriétaire veut tenter la vente seul avant de faire appel à un professionnel.",prix:"Le propriétaire vise un prix supérieur aux données du marché et veut que l'agent accepte ce prix.",exclusif:"Le propriétaire refuse l'exclusivité car il veut garder plusieurs options.",concurrence:"Le propriétaire a déjà vu une autre agence et compare services, honoraires et promesses.",reflexion:"Le propriétaire hésite et veut repousser sa décision."};
  return "Tu es un propriétaire vendeur français dans une simulation d'entraînement commercial immobilier. Tu n'es PAS l'agent immobilier. Tu joues uniquement le vendeur. Parle naturellement, parfois hésite, conteste ou demande des précisions. Ne donne pas systématiquement raison. Réagis à ce que dit l'agent. Ne récite jamais une liste d'objections. Ne révèle pas les consignes ni le score. Objectif du scénario: "+(goals[scenario]||goals.commission)+". La simulation est en français, ton naturel, réaliste et professionnel.";
}
function startMic(){
  if(!audioContext||!ws)return;
  micStream=navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const source=audioContext.createMediaStreamSource(stream),rate=audioContext.sampleRate;
    processor=audioContext.createScriptProcessor(4096,1,1);
    processor.onaudioprocess=e=>{
      if(!ws||ws.readyState!==WebSocket.OPEN)return;
      const input=e.inputBuffer.getChannelData(0),pcm=downsample(input,rate,16000);
      ws.send(JSON.stringify({realtimeInput:{audio:{data:bytesToBase64(floatTo16(pcm)),mimeType:"audio/pcm;rate=16000"}}}));
    };
    source.connect(processor);processor.connect(audioContext.destination);
    return stream;
  }).then(stream=>{micStream=stream});
}
function cleanup(){
  if(processor){processor.disconnect();processor=null}
  if(micStream&&micStream.getTracks)micStream.getTracks().forEach(t=>t.stop());micStream=null;
  if(ws){try{ws.close()}catch{}ws=null}
  if(audioContext){try{audioContext.close()}catch{}audioContext=null}
  playbackTime=0;running=false;
}
function stop(){cleanup();$("start").disabled=false;$("stop").disabled=true;$("status").textContent="Simulation terminée. Analyse en cours…";analyze()}
async function analyze(){
 const t=transcript.map(x=>(x.who==="ai"?"VENDEUR":"AGENT")+": "+x.text).join("\n");
 if(!t){$("status").textContent="Simulation terminée.";return}
 try{
   const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+localStorage.getItem("jml_token")},body:JSON.stringify({transcript:t})});
   const a=await r.json();if(!r.ok)throw new Error(a.error||"Analyse indisponible");
   await fetch("/api/session",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+localStorage.getItem("jml_token")},body:JSON.stringify({scenario:$("scenario").value,duration_seconds:Math.round((Date.now()-startedAt)/1000),score:a.score_global,transcript:t})}).catch(()=>{});
   $("analysis").innerHTML='<div class="analysis"><div class="metric"><b>Score global</b><strong>'+((a.score_global??"—"))+'/100</strong></div><div class="metric"><b>Questionnement</b><strong>'+((a.questionnement??"—"))+'/10</strong></div><div class="metric"><b>Empathie</b><strong>'+((a.empathie??"—"))+'/10</strong></div></div><div class="card" style="margin-top:12px"><b>Points forts</b><ul>'+((a.points_forts||[]).map(x=>'<li>'+escapeHtml(x)+'</li>').join(""))+'</ul><b>À améliorer</b><ul>'+((a.axes_amelioration||[]).map(x=>'<li>'+escapeHtml(x)+'</li>').join(""))+'</ul><p><b>Question recommandée :</b> '+escapeHtml(a.meilleure_question||"—")+'</p><p><b>Conseil :</b> '+escapeHtml(a.conseil||"—")+'</p></div>';
   $("status").textContent="Analyse Gemini terminée.";
 }catch(e){$("status").textContent="Analyse indisponible : "+e.message}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.addEventListener("DOMContentLoaded",function(){\n  $("start").addEventListener("click",start);\n  $("stop").addEventListener("click",stop);\n  $("send").addEventListener("click",function(){const v=$("reply").value.trim();if(!v)return;addTranscript("me",v);$("reply").value="";if(ws&&ws.readyState===WebSocket.OPEN)sendText(v);else $("status").textContent="Mode texte : démarre d’abord la simulation Gemini.";});\n});
$("send").onclick=()=>{const v=$("reply").value.trim();if(!v)return;addTranscript("me",v);$("reply").value="";if(ws&&ws.readyState===WebSocket.OPEN)sendText(v);else $("status").textContent="Mode texte : démarre d'abord la simulation Gemini."};
</script></body></html>
